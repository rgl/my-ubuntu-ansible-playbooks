- name: Install scrcpy
  args:
    executable: /bin/bash
  ansible.builtin.shell: "{{ lookup('file', 'install-scrcpy.sh') }}"
  environment:
    SCRCPY_VERSION: "{{ scrcpy_version }}"
  register: scrcpy_result
  changed_when: "'ANSIBLE CHANGED NO' not in scrcpy_result.stdout_lines"

- name: Install scrcpy symlink
  ansible.builtin.file:
    src: /opt/scrcpy/scrcpy
    dest: /usr/local/bin/scrcpy
    force: true
    state: link
